[package]
name = "ns-gammactl"
version = "1.0.0"
edition = "2021"
description = "Brightness, contrast and gamma control for KDE Plasma Wayland via ICC profiles"

[dependencies]
wayland-client = "0.31"
wayland-scanner = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wayland-backend = "0.3"
bitflags = "2"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
strip = true
